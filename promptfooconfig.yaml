prompts:
  - "Generate an HTML file with embedded CSS and JavaScript that calculates the total sales from the attached CSV file, which has columns for 'Product' and 'Sales'. The page should display the total sales and a table of sales per product."

providers:
  - openai:gpt-3.5-turbo
  - openai:gpt-4
  - anthropic:claude-2

tests:
  - vars:
      attachments:
        - name: "data.csv"
          url: "data:text/csv;base64,UHJvZHVjdCxTYWxlcwpBcHBsZSwxMApCYW5hbmEsMjAKQ2hlcnJ5LDMw"
    assert:
      - type: "javascript"
        value: "output.includes('10.00') && output.includes('20.00') && output.includes('30.00') && output.includes('60.00')"
